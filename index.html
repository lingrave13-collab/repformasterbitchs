<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cubo Mágico 3D</title>
  <style>
    :root {
      --bg: radial-gradient(circle at 20% 20%, #1f2a44, #0d0f19 60%);
      --panel: rgba(255, 255, 255, 0.06);
      --accent: #4ad7d1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: #e6eefc;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
    }

    #scene-container {
      width: min(100vw, 900px);
      height: min(100vh, 900px);
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.05);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
      position: relative;
    }

    canvas { display: block; }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.18) 0%, rgba(0, 0, 0, 0) 50%);
    }

    .card {
      backdrop-filter: blur(10px);
      background: var(--panel);
      border-radius: 12px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
      max-width: 360px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(18px, 4vw, 22px);
      letter-spacing: 0.4px;
    }

    p {
      margin: 0;
      font-size: clamp(14px, 3.2vw, 15px);
      line-height: 1.5;
      color: #cdd8f4;
    }

    .footer {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .badge {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(74, 215, 209, 0.12);
      color: var(--accent);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.2px;
      border: 1px solid rgba(74, 215, 209, 0.25);
    }

    button {
      pointer-events: auto;
      border: none;
      outline: none;
      background: var(--accent);
      color: #0c121d;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(74, 215, 209, 0.35);
      transition: transform 0.12s ease;
    }

    button:active { transform: translateY(1px) scale(0.99); }

    @media (max-width: 520px) {
      #scene-container { width: 100vw; height: 100vh; border-radius: 0; }
      #hud { padding: 14px; }
      .card { max-width: none; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div id="scene-container"></div>
    <div id="hud">
      <div class="card">
        <h1>Cubo Mágico 3D</h1>
        <p>Use um dedo para girar o cubo, faça pinça para aproximar ou afastar, e arraste com dois dedos para mover a cena. Funciona direto no celular.</p>
      </div>
      <div class="card footer">
        <span class="badge">Toque e arraste para explorar</span>
        <button id="reset">Resetar posição</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/controls/OrbitControls.js';

    const container = document.getElementById('scene-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(4, 3, 4);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);
    controls.rotateSpeed = 0.8;
    controls.maxDistance = 10;
    controls.minDistance = 2.2;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(5, 8, 3);
    scene.add(dirLight);

    const rubiksGroup = new THREE.Group();
    scene.add(rubiksGroup);

    function createStickerMaterials() {
      const colors = ['#ffffff', '#ffd500', '#009e60', '#0051ba', '#ff5800', '#c41e3a'];
      return colors.map((color) => new THREE.MeshStandardMaterial({ color, metalness: 0.1, roughness: 0.35 }));
    }

    function buildCubelet(size, offset) {
      const geometry = new THREE.BoxGeometry(size, size, size);
      const materials = createStickerMaterials();
      const mesh = new THREE.Mesh(geometry, materials);
      mesh.position.copy(offset);
      mesh.castShadow = mesh.receiveShadow = true;
      return mesh;
    }

    function buildRubiksCube() {
      const gap = 1.05;
      const half = (gap * 2) / 2;
      for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {
          for (let z = -1; z <= 1; z++) {
            const pos = new THREE.Vector3(x * gap, y * gap, z * gap);
            const cubelet = buildCubelet(0.98, pos);
            cubelet.userData.isCenter = Math.abs(x) + Math.abs(y) + Math.abs(z) === 0;
            rubiksGroup.add(cubelet);
          }
        }
      }
    }

    buildRubiksCube();

    const basePlane = new THREE.Mesh(
      new THREE.CircleGeometry(6, 64),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.03 })
    );
    basePlane.rotation.x = -Math.PI / 2;
    basePlane.position.y = -2;
    scene.add(basePlane);

    function resizeRenderer() {
      const { clientWidth, clientHeight } = container;
      renderer.setSize(clientWidth, clientHeight);
      camera.aspect = clientWidth / clientHeight;
      camera.updateProjectionMatrix();
    }

    window.addEventListener('resize', resizeRenderer);

    const resetButton = document.getElementById('reset');
    resetButton.addEventListener('click', () => {
      camera.position.set(4, 3, 4);
      controls.target.set(0, 0, 0);
      controls.update();
    });

    function animate() {
      requestAnimationFrame(animate);
      rubiksGroup.rotation.y += 0.0015;
      controls.update();
      renderer.render(scene, camera);
    }

    resizeRenderer();
    animate();
  </script>
</body>
</html>
