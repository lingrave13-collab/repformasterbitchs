<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidescroller Shooter</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Press Start 2P', cursive; }
        canvas { background: linear-gradient(to bottom, #87CEEB, #F0F8FF); border: 2px solid #555; display: block; }
        #game-container { position: relative; }
        #upgrade-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            color: white;
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }
        .upgrade-card {
            background: rgba(50, 50, 50, 0.9);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }
        .upgrade-card:hover {
            background-color: rgba(80, 80, 80, 0.9);
        }
        .upgrade-card h3 {
            margin-top: 0;
            margin-bottom: 5px;
            color: #FFD700;
        }
        .upgrade-card p {
            font-size: 0.9em;
            margin-bottom: 0;
            color: #ccc;
        }
    </style>
    <!-- Optional: Google Fonts for a pixelated look -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="upgrade-menu"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const upgradeMenu = document.getElementById('upgrade-menu');

        canvas.width = 1200; // Standard game width
        canvas.height = 600; // Standard game height

        // Game State
        let gameRunning = true;
        let showUpgradeMenu = false;

        // Player Stats and Properties
        const player = {
            x: 50,
            y: canvas.height - 100, // Initial position above ground
            width: 30,
            height: 50,
            color: 'blue',
            dx: 0,
            dy: 0,
            speed: 5,
            jumpForce: -12,
            gravity: 0.5,
            isJumping: false,
            onGround: false,
            maxHealth: 100,
            currentHealth: 100,
            invincible: false,
            invincibilityDuration: 500, // ms
            lastHitTime: 0,
            xp: 0,
            level: 1,
            xpToNextLevel: 100,
            projectileDamage: 10,
            projectileCooldown: 200, // ms
            lastShotTime: 0,
            critChance: 0.05, // 5%
            critDamageMultiplier: 1.5, // 50% extra
            defense: 0, // % damage reduction
            attackSpeedMultiplier: 1, // higher means faster (1.2 = 20% faster)
            movementSpeedMultiplier: 1, // 1.2 = 20% faster
            jumpHeightMultiplier: 1, // 1.3 = 30% higher
            projectileSizeMultiplier: 1,
            extraJumps: 0,
            currentJumps: 0,
            numUpgradeChoices: 3,
            soulOrbDropChance: 0,
            projectileHitsBeforeExplode: 0, // additional hits
        };

        const playerProjectiles = [];
        const enemyProjectiles = [];
        const itemsOnGround = []; // For soul orbs, healing orbs

        // Game Objects
        const groundBlocks = [
            { x: 0, y: canvas.height - 40, width: 300, height: 40 },
            { x: 350, y: canvas.height - 80, width: 200, height: 40 },
            { x: 600, y: canvas.height - 120, width: 300, height: 40 },
            { x: 950, y: canvas.height - 40, width: 250, height: 40 },
            // Floating platforms
            { x: 100, y: canvas.height - 200, width: 100, height: 20 },
            { x: 450, y: canvas.height - 250, width: 150, height: 20 },
            { x: 800, y: canvas.height - 200, width: 100, height: 20 },
        ];

        const enemies = [];
        let enemySpawnTimer = 0;
        let enemySpawnInterval = 3000; // Initial spawn interval in ms
        let gameDifficultyLevel = 1;
        let enemyLevelMultiplier = 1; // Increase enemy stats based on this

        // Input Handling
        const keys = {
            a: false,
            d: false,
            space: false
        };
        let mouse = {
            x: 0,
            y: 0,
            isDown: false,
            lastClickTime: 0
        };

        // Upgrade Definitions
        const upgradeTiers = {
            common: [
                { name: "Catalyst", desc: "Projectile Damage +2", apply: () => player.projectileDamage += 2 },
                { name: "Eyesight", desc: "Critical Chance +5%", apply: () => player.critChance += 0.05 },
                { name: "Growth", desc: "Max. HP +10", apply: () => { player.maxHealth += 10; player.currentHealth += 10; } },
                { name: "Impulse", desc: "Jump Height +30%", apply: () => player.jumpHeightMultiplier += 0.3 },
                { name: "Renew", desc: "Heal to Max. HP", apply: () => player.currentHealth = player.maxHealth },
                { name: "Resist", desc: "Defense +4%", apply: () => player.defense += 0.04 },
                { name: "Resonance", desc: "Atk Speed +12%", apply: () => player.attackSpeedMultiplier += 0.12 },
                { name: "Souls", desc: "Chance to drop soul orb 1%", apply: () => player.soulOrbDropChance += 0.01 },
                { name: "Stability", desc: "Projectile takes +1 hit before exploding", apply: () => player.projectileHitsBeforeExplode += 1 },
                { name: "Swift", desc: "Movement Speed +20%", apply: () => player.movementSpeedMultiplier += 0.2 },
            ],
            uncommon: [
                { name: "Catalyst+", desc: "Projectile Damage +4", apply: () => player.projectileDamage += 4 },
                { name: "Charge", desc: "Projectile Size +20%", apply: () => player.projectileSizeMultiplier += 0.2 },
                { name: "Cloak", desc: "Invulnerability after taking damage +10% duration", apply: () => player.invincibilityDuration *= 1.1 },
                { name: "Fragmentation", desc: "When killed, enemies release 2 weaker projectiles", apply: () => { /* Implement Fragmentation later */ console.log("Fragmentation chosen"); } },
                { name: "Friction", desc: "For every meter you run, 1 explosive projectile is launched upwards", apply: () => { /* Implement Friction later */ console.log("Friction chosen"); } },
                { name: "Growth+", desc: "Max. HP +20", apply: () => { player.maxHealth += 20; player.currentHealth += 20; } },
                { name: "Gush", desc: "Adds +1 Jump", apply: () => player.extraJumps += 1 },
                { name: "Leech", desc: "Life Steal of 3% Damage", apply: () => { /* Implement Leech later */ console.log("Leech chosen"); } },
                { name: "Luck", desc: "Bigger chance to roll uncommon items", apply: () => { /* Implement Luck later */ console.log("Luck chosen"); } },
                { name: "Orb", desc: "Dead enemies have 5% chance to drop a healing orb", apply: () => { /* Implement Orb later */ console.log("Orb chosen"); } },
                { name: "Precision", desc: "Critical deals +50% damage", apply: () => player.critDamageMultiplier += 0.5 },
                { name: "Rage", desc: "If under 50% HP, raises your projectile and body damage", apply: () => { /* Implement Rage later */ console.log("Rage chosen"); } },
                { name: "Regrowth", desc: "Regenerates HP% based on enemies alive", apply: () => { /* Implement Regrowth later */ console.log("Regrowth chosen"); } },
                { name: "Resonance+", desc: "Attack Speed +24%", apply: () => player.attackSpeedMultiplier += 0.24 },
                { name: "Shrink", desc: "Makes you 10% smaller", apply: () => { player.width *= 0.9; player.height *= 0.9; } },
                { name: "Swift+", desc: "Movement Speed +40%", apply: () => player.movementSpeedMultiplier += 0.4 },
                { name: "Thunderbolt", desc: "Calls 2 thunderbolts from the skies every few seconds", apply: () => { /* Implement Thunderbolt later */ console.log("Thunderbolt chosen"); } },
            ],
            rare: [
                { name: "Appraisal", desc: "+1 item choice from now on", apply: () => player.numUpgradeChoices += 1 },
                { name: "Barrier", desc: "Creates a shield that blocks damage once every few seconds", apply: () => { /* Implement Barrier later */ console.log("Barrier chosen"); } },
                { name: "Cold", desc: "Enemies get 1% slower every time they take damage", apply: () => { /* Implement Cold later */ console.log("Cold chosen"); } },
                { name: "Fragmentation+", desc: "When killed, enemies release 6 weaker projectile in random directions", apply: () => { /* Implement Fragmentation+ later */ console.log("Fragmentation+ chosen"); } },
                { name: "Friction+", desc: "For every meter you run, 3 explosive projectile is launched upwards", apply: () => { /* Implement Friction+ later */ console.log("Friction+ chosen"); } },
                { name: "Focus", desc: "Gains attack speed every second you don't move", apply: () => { /* Implement Focus later */ console.log("Focus chosen"); } },
                { name: "Growth++", desc: "Max. HP +40", apply: () => { player.maxHealth += 40; player.currentHealth += 40; } },
                { name: "Immortal", desc: "+1 Revive (kill all enemies when reviving)", apply: () => { /* Implement Immortal later */ console.log("Immortal chosen"); } },
                { name: "Leech+", desc: "Life Steal of 9% Damage", apply: () => { /* Implement Leech+ later */ console.log("Leech+ chosen"); } },
                { name: "Overheat", desc: "Your body deals 40 damage on contact", apply: () => { /* Implement Overheat later */ console.log("Overheat chosen"); } },
                { name: "Thunderbolt+", desc: "Calls 6 thunderbolts from the skies every few seconds", apply: () => { /* Implement Thunderbolt+ later */ console.log("Thunderbolt+ chosen"); } },
                { name: "Tome", desc: "New common items (white) you pick up are 35% more effective", apply: () => { /* Implement Tome later */ console.log("Tome chosen"); } },
                { name: "Will-O-Wisp", desc: "Summons a wisp that inherits half your attack damage and speed", apply: () => { /* Implement Will-O-Wisp later */ console.log("Will-O-Wisp chosen"); } },
                { name: "Wound", desc: "Dealing damage applies bleeding to the enemy", apply: () => { /* Implement Wound later */ console.log("Wound chosen"); } },
            ]
        };

        // Helper Functions
        function getRandomUpgrade(tier) {
            const upgrades = upgradeTiers[tier];
            return upgrades[Math.floor(Math.random() * upgrades.length)];
        }

        function getUpgradeChoices() {
            const choices = [];
            // For simplicity, let's just pick 'common' for now.
            // A more robust system would involve 'luck' stat to pick higher tiers.
            for (let i = 0; i < player.numUpgradeChoices; i++) {
                choices.push(getRandomUpgrade('common'));
            }
            return choices;
        }

        function chooseUpgrade(upgrade) {
            upgrade.apply();
            showUpgradeMenu = false;
            upgradeMenu.style.display = 'none';
            gameRunning = true;
            // Clear current choices to prevent re-applying or showing old ones
            while (upgradeMenu.firstChild) {
                upgradeMenu.removeChild(upgradeMenu.firstChild);
            }
        }

        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                   obj1.x + obj1.width > obj2.x &&
                   obj1.y < obj2.y + obj2.height &&
                   obj1.y + obj1.height > obj2.y;
        }

        function getAngle(x1, y1, x2, y2) {
            return Math.atan2(y2 - y1, x2 - x1);
        }

        function calculateDamage(baseDamage, defense) {
            return Math.max(0, baseDamage * (1 - defense));
        }

        // Game Loop Functions
        function updatePlayer(deltaTime) {
            // Horizontal Movement
            player.dx = 0;
            if (keys.a) {
                player.dx = -player.speed * player.movementSpeedMultiplier;
            }
            if (keys.d) {
                player.dx = player.speed * player.movementSpeedMultiplier;
            }

            // Jumping
            if (keys.space && !player.isJumping) {
                player.dy = player.jumpForce * player.jumpHeightMultiplier;
                player.isJumping = true;
                player.onGround = false;
                player.currentJumps = 1; // Used 1 jump
            } else if (keys.space && player.isJumping && player.currentJumps < (1 + player.extraJumps)) {
                // Double jump / extra jumps
                player.dy = player.jumpForce * player.jumpHeightMultiplier;
                player.currentJumps++;
                keys.space = false; // Prevent continuous extra jumps on hold
            }


            // Apply gravity
            player.dy += player.gravity;

            // Update position
            player.x += player.dx;
            player.y += player.dy;

            // Keep player within canvas bounds horizontally
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Collision with ground blocks
            player.onGround = false;
            for (const block of groundBlocks) {
                if (checkCollision(player, block)) {
                    // If falling onto block
                    if (player.dy > 0 && player.y + player.height - player.dy <= block.y) {
                        player.y = block.y - player.height;
                        player.dy = 0;
                        player.isJumping = false;
                        player.onGround = true;
                        player.currentJumps = 0; // Reset jumps
                    }
                    // If jumping into block from below (head bonk)
                    else if (player.dy < 0 && player.y - player.dy >= block.y + block.height) {
                        player.y = block.y + block.height;
                        player.dy = 0;
                    }
                    // If walking into block horizontally
                    else if (player.dx !== 0) {
                        if (player.dx > 0 && player.x + player.width - player.dx <= block.x) { // Collided from left
                            player.x = block.x - player.width;
                        } else if (player.dx < 0 && player.x - player.dx >= block.x + block.width) { // Collided from right
                            player.x = block.x + block.width;
                        }
                    }
                }
            }

            // Fall off platform
            if (player.dy > 0 && !player.onGround) {
                // Check if player is above any block
                let aboveBlock = false;
                for (const block of groundBlocks) {
                    if (player.x + player.width > block.x && player.x < block.x + block.width &&
                        player.y + player.height <= block.y && player.y + player.height + player.dy >= block.y) {
                        aboveBlock = true;
                        break;
                    }
                }
                if (!aboveBlock) {
                    // No block directly below, continue falling
                }
            }

            // Prevent falling through canvas floor
            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
                player.dy = 0;
                player.isJumping = false;
                player.onGround = true;
                player.currentJumps = 0;
            }

            // Shooting
            const actualProjectileCooldown = player.projectileCooldown / player.attackSpeedMultiplier;
            if (mouse.isDown && Date.now() - player.lastShotTime > actualProjectileCooldown) {
                const angle = getAngle(player.x + player.width / 2, player.y + player.height / 2, mouse.x, mouse.y);
                const speed = 10;
                const isCrit = Math.random() < player.critChance;
                const damage = player.projectileDamage * (isCrit ? player.critDamageMultiplier : 1);
                playerProjectiles.push({
                    x: player.x + player.width / 2,
                    y: player.y + player.height / 2,
                    radius: 5 * player.projectileSizeMultiplier,
                    color: isCrit ? 'yellow' : 'red',
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    damage: damage,
                    crit: isCrit,
                    hitsRemaining: player.projectileHitsBeforeExplode + 1
                });
                player.lastShotTime = Date.now();
            }

            // Invincibility after hit
            if (player.invincible && Date.now() - player.lastHitTime > player.invincibilityDuration) {
                player.invincible = false;
            }
        }

        function updateProjectiles(deltaTime) {
            // Player Projectiles
            for (let i = playerProjectiles.length - 1; i >= 0; i--) {
                const p = playerProjectiles[i];
                p.x += p.dx;
                p.y += p.dy;

                // Remove if out of bounds
                if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                    playerProjectiles.splice(i, 1);
                    continue;
                }

                // Collision with enemies
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (checkCollision({ x: p.x - p.radius, y: p.y - p.radius, width: p.radius * 2, height: p.radius * 2 }, enemy)) {
                        enemy.currentHealth -= p.damage;
                        p.hitsRemaining--;

                        if (enemy.currentHealth <= 0) {
                            addExperience(enemy.xpValue);
                            if (Math.random() < player.soulOrbDropChance) {
                                itemsOnGround.push({ x: enemy.x + enemy.width / 2, y: enemy.y + enemy.height / 2, type: 'soulOrb', radius: 8, color: 'purple' });
                            }
                            enemies.splice(j, 1);
                        }

                        if (p.hitsRemaining <= 0) {
                            playerProjectiles.splice(i, 1);
                            break; // Stop checking this projectile against other enemies
                        }
                    }
                }
            }

            // Enemy Projectiles
            for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
                const p = enemyProjectiles[i];
                p.x += p.dx;
                p.y += p.dy;

                // Remove if out of bounds
                if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                    enemyProjectiles.splice(i, 1);
                    continue;
                }

                // Collision with player
                if (!player.invincible && checkCollision({ x: p.x - p.radius, y: p.y - p.radius, width: p.radius * 2, height: p.radius * 2 }, player)) {
                    player.currentHealth -= calculateDamage(p.damage, player.defense);
                    player.invincible = true;
                    player.lastHitTime = Date.now();
                    enemyProjectiles.splice(i, 1);
                    if (player.currentHealth <= 0) {
                        gameOver();
                    }
                    continue;
                }
            }
        }

        function updateEnemies(deltaTime) {
            enemySpawnTimer += deltaTime;
            if (enemySpawnTimer > enemySpawnInterval) {
                spawnEnemy();
                enemySpawnTimer = 0;
                // Gradually increase difficulty
                enemySpawnInterval = Math.max(500, enemySpawnInterval - 50); // Min 0.5 sec interval
                gameDifficultyLevel += 0.1;
                enemyLevelMultiplier = 1 + (gameDifficultyLevel * 0.1);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];

                // Movement
                const stoppingHeight = canvas.height * 0.7; // 70% from top
                if (enemy.y + enemy.height < stoppingHeight) {
                    enemy.y += enemy.speed * (deltaTime / 16); // Move downwards until stopping height
                } else {
                    // Follow player with smooth delay
                    const targetX = player.x + player.width / 2;
                    const deltaX = targetX - (enemy.x + enemy.width / 2);
                    enemy.x += deltaX * enemy.followFactor * (deltaTime / 16);

                    // Shooting
                    const actualEnemyProjectileCooldown = enemy.projectileCooldown / enemyLevelMultiplier;
                    if (Date.now() - enemy.lastShotTime > actualEnemyProjectileCooldown) {
                        const angle = getAngle(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, player.x + player.width / 2, player.y + player.height / 2);
                        const speed = 5;
                        enemyProjectiles.push({
                            x: enemy.x + enemy.width / 2,
                            y: enemy.y + enemy.height / 2,
                            radius: 4,
                            color: 'orange',
                            dx: Math.cos(angle) * speed,
                            dy: Math.sin(angle) * speed,
                            damage: enemy.damage * enemyLevelMultiplier
                        });
                        enemy.lastShotTime = Date.now();
                    }
                }
            }
        }

        function spawnEnemy() {
            const enemyWidth = 30;
            const enemyHeight = 30;
            const enemy = {
                x: Math.random() * (canvas.width - enemyWidth),
                y: -enemyHeight, // Spawn above screen
                width: enemyWidth,
                height: enemyHeight,
                color: 'purple',
                speed: 1 + Math.random(), // Initial vertical speed
                followFactor: 0.01 + (gameDifficultyLevel * 0.001), // How fast it follows player
                maxHealth: 20 * enemyLevelMultiplier,
                currentHealth: 20 * enemyLevelMultiplier,
                damage: 10 * enemyLevelMultiplier,
                projectileCooldown: 1500 + Math.random() * 1000, // ms
                lastShotTime: Date.now(),
                xpValue: 10 * enemyLevelMultiplier
            };
            enemies.push(enemy);
        }

        function updateItems(deltaTime) {
            for (let i = itemsOnGround.length - 1; i >= 0; i--) {
                const item = itemsOnGround[i];
                // Check for player collision to pick up
                if (checkCollision({ x: item.x - item.radius, y: item.y - item.radius, width: item.radius * 2, height: item.radius * 2 }, player)) {
                    if (item.type === 'soulOrb') {
                        addExperience(5); // Small XP boost for soul orb
                    } else if (item.type === 'healingOrb') {
                        player.currentHealth = Math.min(player.maxHealth, player.currentHealth + 10); // Heal 10 HP
                    }
                    itemsOnGround.splice(i, 1);
                }
            }
        }


        function addExperience(amount) {
            player.xp += amount;
            if (player.xp >= player.xpToNextLevel) {
                player.level++;
                player.xp = 0;
                player.xpToNextLevel = Math.floor(player.xpToNextLevel * 1.5); // Next level harder
                levelUp();
            }
        }

        function levelUp() {
            gameRunning = false;
            showUpgradeMenu = true;
            displayUpgradeMenu();
        }

        function gameOver() {
            gameRunning = false;
            alert("Game Over! You reached level " + player.level);
            document.location.reload(); // Simple restart
        }

        // Drawing Functions
        function drawPlayer() {
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw invincibility flash
            if (player.invincible && (Date.now() / 100) % 2 < 1) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }
        }

        function drawGround() {
            ctx.fillStyle = '#663300'; // Brown
            for (const block of groundBlocks) {
                ctx.fillRect(block.x, block.y, block.width, block.height);
            }
        }

        function drawEnemies() {
            for (const enemy of enemies) {
                ctx.fillStyle = enemy.color;
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

                // Draw HP bar for enemy
                const hpBarWidth = enemy.width;
                const hpBarHeight = 3;
                const hpBarY = enemy.y - hpBarHeight - 2;
                ctx.fillStyle = 'red';
                ctx.fillRect(enemy.x, hpBarY, hpBarWidth, hpBarHeight);
                ctx.fillStyle = 'lime';
                ctx.fillRect(enemy.x, hpBarY, (enemy.currentHealth / enemy.maxHealth) * hpBarWidth, hpBarHeight);
            }
        }

        function drawProjectiles() {
            // Player Projectiles
            for (const p of playerProjectiles) {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                if (p.crit) {
                    ctx.strokeStyle = 'gold';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }

            // Enemy Projectiles
            for (const p of enemyProjectiles) {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawHUD() {
            // HP Bar
            const hpBarX = 10;
            const hpBarY = 10;
            const hpBarWidth = 200;
            const hpBarHeight = 20;

            ctx.fillStyle = 'gray';
            ctx.fillRect(hpBarX, hpBarY, hpBarWidth, hpBarHeight);
            ctx.fillStyle = 'red';
            ctx.fillRect(hpBarX, hpBarY, (player.currentHealth / player.maxHealth) * hpBarWidth, hpBarHeight);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.strokeRect(hpBarX, hpBarY, hpBarWidth, hpBarHeight);

            ctx.fillStyle = 'white';
            ctx.font = '12px "Press Start 2P"';
            ctx.textAlign = 'left';
            ctx.fillText(`HP: ${Math.floor(player.currentHealth)}/${player.maxHealth}`, hpBarX + 5, hpBarY + 15);

            // EXP Bar
            const expBarX = 10;
            const expBarY = hpBarY + hpBarHeight + 10;
            const expBarWidth = 200;
            const expBarHeight = 15;

            ctx.fillStyle = 'gray';
            ctx.fillRect(expBarX, expBarY, expBarWidth, expBarHeight);
            ctx.fillStyle = 'cyan';
            ctx.fillRect(expBarX, expBarY, (player.xp / player.xpToNextLevel) * expBarWidth, expBarHeight);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 1;
            ctx.strokeRect(expBarX, expBarY, expBarWidth, expBarHeight);

            ctx.fillStyle = 'white';
            ctx.font = '10px "Press Start 2P"';
            ctx.fillText(`LVL ${player.level} XP: ${Math.floor(player.xp)}/${player.xpToNextLevel}`, expBarX + 5, expBarY + 12);
        }

        function drawItems() {
            for (const item of itemsOnGround) {
                if (item.type === 'soulOrb') {
                    ctx.fillStyle = item.color;
                    ctx.beginPath();
                    ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
                    ctx.fill();
                } else if (item.type === 'healingOrb') {
                    ctx.fillStyle = item.color; // Green for healing
                    ctx.beginPath();
                    ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }

        function displayUpgradeMenu() {
            upgradeMenu.style.display = 'flex';
            const choices = getUpgradeChoices();

            // Clear previous choices
            while (upgradeMenu.firstChild) {
                upgradeMenu.removeChild(upgradeMenu.firstChild);
            }

            const title = document.createElement('h2');
            title.textContent = "Choose Your Upgrade!";
            upgradeMenu.appendChild(title);

            choices.forEach(upgrade => {
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `<h3>${upgrade.name}</h3><p>${upgrade.desc}</p>`;
                card.onclick = () => chooseUpgrade(upgrade);
                upgradeMenu.appendChild(card);
            });
        }

        // Main Game Loop
        let lastTime = 0;
        function gameLoop(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            if (gameRunning) {
                ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas
                drawGround();
                updatePlayer(deltaTime);
                updateEnemies(deltaTime);
                updateProjectiles(deltaTime);
                updateItems(deltaTime);

                drawEnemies();
                drawProjectiles();
                drawPlayer();
                drawItems();
                drawHUD();
            }

            requestAnimationFrame(gameLoop);
        }
